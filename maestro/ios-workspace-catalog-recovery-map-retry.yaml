appId: host.exp.Exponent
---
- assertVisible:
    id: "workspace-access-refresh"
    enabled: true
- tapOn:
    id: "workspace-access-refresh"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: false
    timeout: 3000
- assertVisible: "Checking current workspace access. Cached workspace remains available for review only."
- tapOn:
    id: "workspace-access-refresh"
    optional: true
    waitToSettleTimeoutMs: 100
- takeScreenshot: "workspace-catalog-map-retry-busy"
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: true
    timeout: 15000
- assertVisible: "Workspace access not verified. Try checking current access again."
- takeScreenshot: "workspace-catalog-map-retry-failed"
