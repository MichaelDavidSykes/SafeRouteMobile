appId: host.exp.Exponent
---
- stopApp
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- runFlow: subflows/ios-open-expo-project.yaml
- runFlow:
    when:
      visible:
        id: "safe-route-suspended-navigation"
    commands:
      - tapOn:
          id: "safe-route-suspended-navigation-end"
- runFlow:
    when:
      visible:
        id: "safe-route-stop-action"
    commands:
      - tapOn:
          id: "safe-route-stop-action"
          waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      visible:
        id: "safe-route-return"
    commands:
      - tapOn:
          id: "safe-route-return"
- runFlow:
    when:
      visible:
        id: "safe-route-operations-sign-out"
    commands:
      - tapOn:
          id: "safe-route-operations-sign-out"
- runFlow:
    when:
      visible:
        id: "route-list-sign-out"
    commands:
      - tapOn:
          id: "route-list-sign-out"
- runFlow:
    when:
      visible:
        id: "safe-route-login"
    commands:
      - tapOn:
          id: "safe-route-login-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-primary-action"
    timeout: 15000
- tapOn:
    id: "guest-map-primary-action"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible:
        id: "route-list-sign-out"
    commands:
      - tapOn:
          id: "route-list-sign-out"
- waitForAnimationToEnd:
    timeout: 2500
- runFlow:
    when:
      visible:
        id: "safe-route-login"
    commands:
      - tapOn:
          id: "safe-route-login-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-primary-action"
    timeout: 15000
- assertNotVisible:
    id: "safe-route-resume-action"
