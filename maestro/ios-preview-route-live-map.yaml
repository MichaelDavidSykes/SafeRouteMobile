appId: host.exp.Exponent
---
- stopApp
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
# Re-open the deep link once Expo Go is foregrounded; local simulator runs can
# otherwise land on the Expo Go home screen even with the dev server available.
- openLink: exp://127.0.0.1:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 10000
# Expo Go's first-run developer-menu tutorial and follow-on dev-menu sheet are
# not always exposed in XCUITest's accessibility tree. Coordinate taps dismiss
# that Expo chrome without adding conditional hierarchy polls, which are flaky
# on the local simulator.
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "91%,49%"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "guest-map-primary-action"
    commands:
      - assertVisible:
          id: "guest-map-primary-action"
      # Expo Go's floating Tools button can cover the authenticated top Saved
      # capsule in development. Use the lower authenticated Trips entry instead;
      # it reaches the same route picker in preview mode without coordinate taps
      # near Expo chrome.
      - assertVisible:
          id: "guest-map-gate-planned-trips"
      - tapOn:
          id: "guest-map-gate-planned-trips"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "safe-route-picker"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "safe-route-picker"
    commands:
      - assertVisible:
          id: "saferoute-app-root"
      - assertVisible:
          id: "safe-route-picker"
      - assertVisible:
          text: "Choose route"
      - tapOn:
          id: "safe-route-card-sr-city-airport-alpha"
      - waitForAnimationToEnd:
          timeout: 5000
- extendedWaitUntil:
    visible:
      id: "safe-route-live-map"
    timeout: 30000
- assertVisible:
    id: "safe-route-live-map"
- assertVisible:
    id: "safe-route-summary-sheet"
- assertVisible:
    id: "safe-route-primary-action"
- assertVisible:
    id: "safe-route-demo-action"
- tapOn:
    id: "safe-route-demo-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-demo-action"
- tapOn:
    id: "safe-route-primary-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-stop-action"
- tapOn:
    id: "safe-route-stop-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-primary-action"
