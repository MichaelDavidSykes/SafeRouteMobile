appId: host.exp.Exponent
---
- stopApp
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
# Re-open the deep link once Expo Go is foregrounded; local simulator runs can
# otherwise land on the Expo Go home screen even with the dev server available.
# `localhost` matches Expo's no-build `expo start --localhost` listener, which
# may bind only to IPv6 loopback on macOS while the simulator still resolves it.
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 10000
# Keep the handoff on localhost only. A previous IPv4 loopback retry could time
# out in iOS before app assertions, making the smoke fail before SafeRoute could
# render. If Expo Go stays on its home screen, the app-root wait below records
# the actual handoff blocker instead of adding another deep-link failure mode.
# Expo Go may request foreground location before the React tree settles. Accept
# the prompt here so the app root/live-map probes are not hidden behind iOS
# system chrome during no-build smoke runs.
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "safe-route-return"
    commands:
      - tapOn:
          id: "safe-route-return"
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 3000
- runFlow:
    when:
      visible:
        id: "safe-route-operations-map-return"
    commands:
      - tapOn:
          id: "safe-route-operations-map-return"
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 3000
- tapOn:
    id: "safe-route-tab-map"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: "guest-map-collapsed-sheet"
    commands:
      - tapOn:
          point: "50%,85%"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "guest-map-destination-input"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "guest-map-destination-input"
    commands:
      - assertVisible:
          id: "guest-map-destination-input"
      - tapOn:
          id: "guest-map-destination-input"
      - inputText: "51.5100, -0.0900"
      - extendedWaitUntil:
          visible:
            id: "guest-map-search-coordinate-51-510000-0-090000"
          timeout: 10000
      - tapOn:
          id: "guest-map-search-coordinate-51-510000-0-090000"
      - tapOn:
          id: "guest-map-plot-action"
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: "guest-map-travel-mode-selector"
          timeout: 10000
      - tapOn:
          id: "guest-map-travel-mode-drive"
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: "guest-map-collapsed-sheet"
          timeout: 30000
      - tapOn:
          id: "guest-map-collapsed-sheet"
          waitToSettleTimeoutMs: 1000
      - extendedWaitUntil:
          visible:
            id: "guest-map-route-preview"
          timeout: 10000
      - assertVisible:
          id: "guest-map-plot-action"
      - tapOn:
          id: "guest-map-plot-action"
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "safe-route-live-map"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "safe-route-picker"
    commands:
      - assertVisible:
          id: "saferoute-app-root"
      - assertVisible:
          id: "safe-route-picker"
      - assertVisible:
          text: "Choose route"
      - tapOn:
          id: "safe-route-card-sr-city-airport-alpha"
      - waitForAnimationToEnd:
          timeout: 5000
      # Saved-route cards open a review surface, so this fallback keeps its
      # explicit Start. The guest planner's Start action below starts directly.
      - extendedWaitUntil:
          visible:
            id: "safe-route-live-map"
          timeout: 30000
      - tapOn:
          id: "safe-route-primary-action"
          waitToSettleTimeoutMs: 1000
# Guest Start requests location as the live map opens. Accept a first-time iOS
# permission prompt without adding a second in-app Start tap.
- extendedWaitUntil:
    visible:
      id: "safe-route-live-map"
    timeout: 30000
- assertVisible:
    id: "safe-route-live-map"
- assertVisible:
    id: "safe-route-summary-sheet"
- assertVisible:
    id: "safe-route-primary-action"
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "safe-route-stop-action"
    timeout: 15000
- assertVisible:
    id: "safe-route-remaining-metrics"
- assertVisible:
    id: "safe-route-control-fit"
- assertVisible:
    id: "safe-route-control-center"
- assertNotVisible:
    id: "safe-route-control-reroute"
- assertNotVisible:
    id: "safe-route-background-navigation-action"
- assertVisible:
    id: "safe-route-return"
- tapOn:
    id: "safe-route-primary-action"
    waitToSettleTimeoutMs: 1000
- assertVisible: "Resume route guidance"
- assertVisible:
    id: "safe-route-stop-action"
- tapOn:
    id: "safe-route-primary-action"
    waitToSettleTimeoutMs: 1000
- assertVisible: "Pause route guidance"
- tapOn:
    id: "safe-route-stop-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-primary-action"
