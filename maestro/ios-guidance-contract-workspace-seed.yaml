appId: host.exp.Exponent
---
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 10000
- tapOn:
    id: "safe-route-login-email"
- inputText: "driver@example.com"
- tapOn:
    id: "safe-route-login-password"
- inputText: "guidance-contract-password"
- tapOn:
    id: "safe-route-login-primary-action"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible:
        id: "workspace-access-refresh"
    commands:
      - tapOn:
          id: "workspace-access-refresh"
- runFlow:
    when:
      visible:
        id: "guest-map-primary-action"
    commands:
      - tapOn:
          id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "safe-route-card-guidance-contract-route"
    timeout: 20000
- setLocation:
    latitude: 51.5075
    longitude: -0.1277
- tapOn:
    id: "safe-route-card-guidance-contract-route"
- extendedWaitUntil:
    visible:
      id: "safe-route-live-map"
    timeout: 20000
- tapOn:
    id: "safe-route-primary-action"
- waitForAnimationToEnd:
    timeout: 3000
- setLocation:
    latitude: 51.5076
    longitude: -0.1276
- waitForAnimationToEnd:
    timeout: 1000
- setLocation:
    latitude: 51.5077
    longitude: -0.1275
- extendedWaitUntil:
    visible:
      id: "safe-route-stop-action"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 3000
- stopApp
