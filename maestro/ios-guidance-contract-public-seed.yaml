appId: host.exp.Exponent
---
- tapOn:
    id: "guest-map-destination-input"
- inputText: "51.5053, 0.0553"
- extendedWaitUntil:
    visible:
      id: "guest-map-search-coordinate-51-505300-0-055300"
    timeout: 10000
- tapOn:
    id: "guest-map-search-coordinate-51-505300-0-055300"
- tapOn:
    id: "guest-map-plot-action"
- extendedWaitUntil:
    visible:
      id: "guest-map-route-preview"
    timeout: 30000
- tapOn:
    id: "guest-map-plot-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-live-map"
    timeout: 15000
- tapOn:
    id: "safe-route-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-stop-action"
    timeout: 15000
- assertVisible:
    id: "safe-route-remaining-metrics"
- waitForAnimationToEnd:
    timeout: 3000
- stopApp
