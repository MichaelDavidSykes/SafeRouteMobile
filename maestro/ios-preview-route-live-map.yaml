appId: host.exp.Exponent
---
- stopApp
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
# Re-open the deep link once Expo Go is foregrounded; local simulator runs can
# otherwise land on the Expo Go home screen even with the dev server available.
# `localhost` matches Expo's no-build `expo start --localhost` listener, which
# may bind only to IPv6 loopback on macOS while the simulator still resolves it.
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 10000
# Keep the handoff on localhost only. A previous IPv4 loopback retry could time
# out in iOS before app assertions, making the smoke fail before SafeRoute could
# render. If Expo Go stays on its home screen, the app-root wait below records
# the actual handoff blocker instead of adding another deep-link failure mode.
# Expo Go's first-run developer-menu tutorial and follow-on dev-menu sheet are
# not always exposed in XCUITest's accessibility tree. Coordinate taps dismiss
# that Expo chrome without adding conditional hierarchy polls, which are flaky
# on the local simulator.
- tapOn:
    point: "50%,92%"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    point: "91%,49%"
- waitForAnimationToEnd:
    timeout: 5000
# Expo Go may request foreground location before the React tree settles. Accept
# the prompt here so the app root/live-map probes are not hidden behind iOS
# system chrome during no-build smoke runs.
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "guest-map-primary-action"
    commands:
      - assertVisible:
          id: "guest-map-primary-action"
      - assertVisible:
          id: "guest-map-destination-input"
      - tapOn:
          id: "guest-map-destination-input"
      - inputText: "London City Airport"
      - tapOn: "done"
      - waitForAnimationToEnd:
          timeout: 5000
      - assertVisible:
          id: "guest-map-route-preview"
      - assertVisible:
          id: "guest-map-plot-action"
      - tapOn:
          id: "guest-map-plot-action"
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "safe-route-live-map"
          timeout: 30000
- runFlow:
    when:
      visible:
        id: "safe-route-picker"
    commands:
      - assertVisible:
          id: "saferoute-app-root"
      - assertVisible:
          id: "safe-route-picker"
      - assertVisible:
          text: "Choose route"
      - tapOn:
          id: "safe-route-card-sr-city-airport-alpha"
      - waitForAnimationToEnd:
          timeout: 5000
# Live location permission is requested only after the user starts guidance,
# so the map can render first without extra system-prompt hierarchy polling.
- extendedWaitUntil:
    visible:
      id: "safe-route-live-map"
    timeout: 30000
- assertVisible:
    id: "safe-route-live-map"
- assertVisible:
    id: "safe-route-summary-sheet"
- assertVisible:
    id: "safe-route-primary-action"
- assertVisible:
    id: "safe-route-demo-action"
- runFlow:
    when:
      visible: "Turn route simulation on"
    commands:
      - tapOn:
          id: "safe-route-demo-action"
          waitToSettleTimeoutMs: 1000
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible: "Turn route simulation off"
- assertVisible:
    id: "safe-route-demo-action"
- tapOn:
    id: "safe-route-primary-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-stop-action"
- assertVisible:
    id: "safe-route-control-fit"
- assertVisible:
    id: "safe-route-control-follow"
- assertVisible:
    id: "safe-route-control-intelligence"
- tapOn:
    id: "safe-route-stop-action"
    waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: "safe-route-primary-action"
