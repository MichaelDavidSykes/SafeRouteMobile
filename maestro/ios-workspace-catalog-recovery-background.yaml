appId: host.exp.Exponent
---
- tapOn:
    id: "route-list-map-return"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- pressKey: HOME
- waitForAnimationToEnd:
    timeout: 2000
