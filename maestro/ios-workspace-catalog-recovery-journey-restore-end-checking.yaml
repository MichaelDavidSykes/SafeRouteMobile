appId: host.exp.Exponent
---
- tapOn:
    id: "safe-route-suspended-navigation-retry"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "Restoring route"
    timeout: 15000
- tapOn:
    id: "safe-route-suspended-navigation-end"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "Suspended route ended."
    timeout: 15000
- takeScreenshot: "workspace-catalog-journey-ended-during-held-retry"
