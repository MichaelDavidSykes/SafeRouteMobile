appId: host.exp.Exponent
---
- stopApp
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "safe-route-suspended-navigation"
    timeout: 15000
- assertVisible: "Guidance paused"
- assertVisible:
    id: "safe-route-suspended-navigation-retry"
- assertVisible:
    id: "safe-route-suspended-navigation-end"
- assertNotVisible:
    id: "safe-route-live-map"
- tapOn:
    id: "safe-route-suspended-navigation-retry"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible: "Guidance paused"
    timeout: 10000
- tapOn:
    id: "guest-map-workspace-selector"
    waitToSettleTimeoutMs: 1000
- assertVisible:
    id: "guest-map-workspace-preview-west"
- tapOn:
    id: "guest-map-workspace-preview-west"
    waitToSettleTimeoutMs: 1000
- assertVisible: "End route and change workspace?"
- assertVisible: "West Corridor"
- tapOn: "Keep route"
- assertVisible:
    id: "safe-route-suspended-navigation"
- assertVisible: "Workspace, Central Operations"
- tapOn:
    id: "guest-map-workspace-selector"
    waitToSettleTimeoutMs: 1000
- tapOn:
    id: "guest-map-workspace-preview-west"
    waitToSettleTimeoutMs: 1000
- tapOn: "End route and change workspace"
- extendedWaitUntil:
    notVisible:
      id: "safe-route-suspended-navigation"
    timeout: 15000
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertVisible: "Workspace, West Corridor"
