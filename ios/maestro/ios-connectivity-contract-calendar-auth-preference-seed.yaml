appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 30000
- tapOn:
    id: "guest-map-sheet-close"
- extendedWaitUntil:
    visible:
      id: "safe-route-tab-calendar"
    timeout: 15000
- tapOn:
    id: "safe-route-tab-calendar"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-route-66e1b2c3d4e5f60718293e40-66b1b2c3d4e5f60718293b40-0"
    timeout: 20000
- tapOn:
    id: "safe-route-operations-workspace-selector"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-workspace-66a1b2c3d4e5f60718293a41"
    timeout: 10000
- tapOn:
    id: "safe-route-operations-workspace-66a1b2c3d4e5f60718293a41"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-route-66e1b2c3d4e5f60718293e41-66b1b2c3d4e5f60718293b41-0"
    timeout: 20000
- assertVisible: "Workspace, Support Operations"
- runFlow:
    when:
      visible: "Offline Calendar saving is off. Nothing will be saved for this workspace until you allow it. Online Operations are unchanged."
    commands:
      - tapOn:
          id: "safe-route-operations-calendar-saving-control"
      - extendedWaitUntil:
          visible: "Offline options"
          timeout: 20000
- assertVisible: "Offline options"
- tapOn:
    id: "safe-route-operations-calendar-saving-control"
- extendedWaitUntil:
    visible: "^Stop offline Calendar saves\\?$"
    timeout: 10000
- tapOn: "^Stop saving$"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-calendar-saving-status"
    timeout: 15000
- assertVisible: "Offline Calendar saving is off. Nothing will be saved for this workspace until you allow it. Online Operations are unchanged."
- tapOn:
    id: "safe-route-operations-workspace-selector"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-workspace-66a1b2c3d4e5f60718293a40"
    timeout: 10000
- tapOn:
    id: "safe-route-operations-workspace-66a1b2c3d4e5f60718293a40"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-route-66e1b2c3d4e5f60718293e40-66b1b2c3d4e5f60718293b40-0"
    timeout: 20000
- assertVisible: "Workspace, Guidance Operations"
- assertVisible: "Offline options"
- tapOn:
    id: "safe-route-tab-map"
- extendedWaitUntil:
    visible:
      id: "guest-map-collapsed-sheet"
    timeout: 15000
- tapOn:
    id: "guest-map-collapsed-sheet"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- takeScreenshot: "connectivity-contract-calendar-auth-preference-seed"
- stopApp
