appId: host.exp.Exponent
---
- openLink: exp://localhost:8081
- extendedWaitUntil:
    visible: "Checking workspace access before plotting this route"
    timeout: 3000
- assertVisible:
    id: "guest-map-plot-action"
    enabled: false
- takeScreenshot: "workspace-catalog-foreground-checking-map"
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: true
    timeout: 20000
- assertVisible: "Workspace access changed. Check for restored access."
- assertVisible: "Workspace, Support Operations"
- tapOn:
    id: "guest-map-primary-action"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      visible:
        id: "guest-map-primary-action"
    commands:
      - tapOn:
          id: "guest-map-primary-action"
          waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b41"
- assertNotVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- takeScreenshot: "workspace-catalog-foreground-loss-saved"
- stopApp
