- assertVisible: "Off route. Current instruction.*"
- assertVisible:
    id: "safe-route-stop-action"
- assertVisible:
    id: "safe-route-journey-66b1b2c3d4e5f60718293b40"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- takeScreenshot: "workspace-catalog-journey-foreground-off-route"
