- assertVisible:
    id: "safe-route-risk-zone-contract-building-exposure"
- assertVisible:
    id: "safe-route-risk-zone-contract-elevation"
- assertVisible:
    id: "safe-route-risk-zone-contract-junction"
- assertVisible:
    id: "safe-route-risk-zone-contract-intersection"
- assertVisible:
    id: "safe-route-risk-zone-contract-support-coverage"
- assertVisible:
    id: "safe-route-risk-zone-contract-straight-corridor"
