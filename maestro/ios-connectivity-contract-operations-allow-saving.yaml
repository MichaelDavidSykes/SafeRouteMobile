appId: host.exp.Exponent
---
- scrollUntilVisible:
    element:
      id: "guest-map-gate-calendar"
    direction: DOWN
    timeout: 20000
    speed: 40
- tapOn:
    id: "guest-map-gate-calendar"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-calendar-saving-status"
    timeout: 20000
- assertVisible: "Offline Calendar saving is off. Nothing will be saved for this workspace until you allow it. Online Operations are unchanged."
- extendedWaitUntil:
    visible:
      id: "safe-route-operations-route-66e1b2c3d4e5f60718293e40-66b1b2c3d4e5f60718293b40-0"
    timeout: 20000
- tapOn:
    id: "safe-route-operations-calendar-saving-control"
- extendedWaitUntil:
    visible: "Offline Calendar saved"
    timeout: 20000
- assertVisible:
    id: "safe-route-operations-route-66e1b2c3d4e5f60718293e40-66b1b2c3d4e5f60718293b40-0"
- assertNotVisible:
    id: "safe-route-operations-offline-notice"
- takeScreenshot: "connectivity-contract-online-operations-saving-allowed"
- tapOn:
    id: "safe-route-operations-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
