appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 30000
- assertVisible: "This saved session belongs to another account. Sign in again."
- assertVisible:
    id: "safe-route-login-email"
    enabled: true
- assertNotVisible:
    id: "guest-map-workspace-selector"
- assertNotVisible:
    id: "safe-route-picker"
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-resume-action"
- takeScreenshot: "connectivity-contract-calendar-principal-change"
