appId: host.exp.Exponent
---
- stopApp
- setLocation:
    latitude: 51.5074
    longitude: -0.1278
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
# Re-open once Expo Go is foregrounded. This mirrors the other no-build preview
# smokes and avoids relying on route-planning gestures to reach authentication.
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      visible: "Try again"
    commands:
      - tapOn: "Try again"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
# Requires the Expo listener to be started with SAFEROUTE_ENABLE_PREVIEW_MODE=true
# and SAFEROUTE_PREVIEW_INITIAL_SCREEN=login so the smoke opens directly on the
# branded sign-in surface without brittle map long-press setup.
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 30000
- assertVisible: "SafeRoute"
- assertVisible:
    id: "safe-route-login-email"
- assertVisible:
    id: "safe-route-login-password"
- assertVisible:
    id: "safe-route-password-reset-open"
- assertVisible:
    id: "safe-route-login-create-account"
- assertNotVisible: "Cloudflare"
- assertNotVisible: "Turnstile"
- assertVisible:
    id: "safe-route-login-map-return"
- tapOn:
    id: "safe-route-login-create-account"
- extendedWaitUntil:
    visible:
      id: "safe-route-account-create"
    timeout: 5000
- assertVisible: "Create account"
- assertVisible:
    id: "safe-route-account-create-sign-in"
- tapOn:
    id: "safe-route-account-create-sign-in"
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 5000
- tapOn:
    id: "safe-route-login-map-return"
- extendedWaitUntil:
    notVisible:
      id: "safe-route-login"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "guest-map-primary-action"
    timeout: 10000
