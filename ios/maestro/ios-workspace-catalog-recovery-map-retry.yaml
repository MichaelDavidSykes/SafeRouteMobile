appId: host.exp.Exponent
---
- assertVisible:
    id: "workspace-access-refresh"
    enabled: true
- tapOn:
    id: "workspace-access-refresh"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: false
    timeout: 3000
- assertVisible: "Checking current workspace access. This workspace list was cached less than one hour ago for review only. It does not verify access or the age of routes, risk intelligence, or operations. Current workspace access is not verified."
- takeScreenshot: "workspace-catalog-map-retry-busy"
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: true
    timeout: 15000
- assertVisible: "Workspace access not verified. This workspace list was cached less than one hour ago for review only. It does not verify access or the age of routes, risk intelligence, or operations. Try checking current access again."
- takeScreenshot: "workspace-catalog-map-retry-failed"
