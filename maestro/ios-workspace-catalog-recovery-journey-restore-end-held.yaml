appId: host.exp.Exponent
---
- assertVisible: "Restoring route. Cold restart verification v1. Confirming this saved route is ready to resume."
- assertVisible:
    id: "safe-route-suspended-navigation-retry"
    enabled: false
- assertVisible:
    id: "safe-route-suspended-navigation-end"
    enabled: true
- tapOn:
    id: "safe-route-suspended-navigation-end"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible: "Suspended route ended."
    timeout: 15000
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-resume-action"
- assertNotVisible:
    id: "safe-route-stop-action"
- assertNotVisible:
    id: "safe-route-remaining-metrics"
- takeScreenshot: "workspace-catalog-journey-ended-during-held-retry"
