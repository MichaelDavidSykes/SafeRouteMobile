appId: host.exp.Exponent
---
- assertVisible:
    id: "workspace-access-refresh"
    enabled: true
- tapOn:
    id: "workspace-access-refresh"
    waitToSettleTimeoutMs: 100
- extendedWaitUntil:
    visible:
      id: "workspace-access-refresh"
      enabled: false
    timeout: 3000
- assertVisible: "Checking current workspace access. Cached workspace remains available for review only."
- takeScreenshot: "workspace-catalog-operations-recovery-busy"
- extendedWaitUntil:
    notVisible:
      id: "workspace-access-refresh"
    timeout: 15000
- assertVisible: "Workspace access verified."
- assertVisible: "Workspace, Guidance Operations"
- tapOn:
    id: "safe-route-operations-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- assertVisible: "Add destination"
- assertNotVisible: "^Verify$"
- assertNotVisible:
    id: "workspace-access-refresh"
- takeScreenshot: "workspace-catalog-recovered-map"
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 20000
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- assertNotVisible:
    id: "workspace-access-refresh"
- takeScreenshot: "workspace-catalog-recovered-saved"
- stopApp
