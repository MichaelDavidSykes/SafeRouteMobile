appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible: "Active guidance could not be restored because its workspace is no longer available. Plot the route again."
    timeout: 30000
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-resume-action"
- assertVisible:
    id: "workspace-access-refresh"
- waitForAnimationToEnd:
    timeout: 2000
