appId: host.exp.Exponent
---
- stopApp
- setLocation:
    latitude: -34.033
    longitude: 18.585
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 3000
- openLink: exp://localhost:8081
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- waitForAnimationToEnd:
    timeout: 10000
- tapOn:
    text: "Close"
    optional: true
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      visible: "Try again"
    commands:
      - tapOn: "Try again"
      - waitForAnimationToEnd:
          timeout: 8000
- runFlow:
    when:
      visible: "Allow While Using App"
    commands:
      - tapOn: "Allow While Using App"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 45000
- runFlow:
    when:
      visible:
        id: "safe-route-return"
    commands:
      - tapOn:
          id: "safe-route-return"
- runFlow:
    when:
      visible:
        id: "safe-route-operations-map-return"
    commands:
      - tapOn:
          id: "safe-route-operations-map-return"
- tapOn:
    id: "safe-route-tab-map"
- extendedWaitUntil:
    visible:
      id: "safe-route-risk-zone-generated-area-risk-safe-route-area-risk-philippi-east-33b347150ca4712272"
    timeout: 30000
- tapOn:
    id: "safe-route-risk-zone-generated-area-risk-safe-route-area-risk-philippi-east-33b347150ca4712272"
# react-native-maps exposes the marker identifier for assertions, while iOS can
# consume accessibility-initiated marker taps without dispatching the native
# map press callback. Verify the same physical marker interaction a user makes.
- tapOn:
    point: "69%,19%"
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "safe-route-risk-detail"
    timeout: 5000
- assertVisible: ".*Philippi East \\(Cape Flats\\).*"
- assertVisible:
    id: "guest-map-collapsed-sheet"
- tapOn:
    id: "safe-route-risk-detail-dismiss"
- assertNotVisible:
    id: "safe-route-risk-detail"
