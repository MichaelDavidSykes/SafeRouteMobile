appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible:
      id: "safe-route-suspended-navigation"
    timeout: 30000
- assertVisible: "Guidance paused"
- assertVisible: "Reconnect to verify access before guidance can resume."
- assertVisible:
    id: "safe-route-suspended-navigation-retry"
    enabled: false
- assertVisible:
    id: "safe-route-suspended-navigation-end"
    enabled: true
- assertVisible: "Offline map. Saved route information remains available."
- takeScreenshot: "connectivity-contract-offline-guidance"
- tapOn:
    id: "safe-route-suspended-navigation-end"
- extendedWaitUntil:
    notVisible:
      id: "safe-route-suspended-navigation"
    timeout: 15000
- assertVisible: "Suspended route ended."
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- runFlow:
    when:
      visible: "Workspace, Choose workspace"
    commands:
      - tapOn:
          id: "safe-route-workspace-selector"
      - extendedWaitUntil:
          visible:
            id: "safe-route-workspace-66a1b2c3d4e5f60718293a40"
          timeout: 10000
      - tapOn:
          id: "safe-route-workspace-66a1b2c3d4e5f60718293a40"
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- assertVisible: "Offline saved copy · reconnect before starting guidance"
- takeScreenshot: "connectivity-contract-offline-saved-review"
- tapOn:
    id: "route-list-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-network-status"
    timeout: 15000
