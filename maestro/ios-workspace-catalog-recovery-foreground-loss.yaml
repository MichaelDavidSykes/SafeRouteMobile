appId: host.exp.Exponent
---
- extendedWaitUntil:
    visible: "Workspace access changed. Check for restored access."
    timeout: 20000
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-resume-action"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-stop-action"
- assertNotVisible:
    id: "safe-route-remaining-metrics"
- assertVisible: "Workspace, Support Operations"
- tapOn:
    id: "guest-map-primary-action"
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- runFlow:
    when:
      visible:
        id: "guest-map-primary-action"
    commands:
      - tapOn:
          id: "guest-map-primary-action"
          waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b41"
- assertNotVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- takeScreenshot: "workspace-catalog-foreground-loss-saved"
- stopApp
