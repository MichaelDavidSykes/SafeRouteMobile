appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible:
      id: "guest-map-primary-action"
    timeout: 30000
- assertVisible: "Sign in"
- assertNotVisible:
    id: "safe-route-login"
- assertNotVisible:
    id: "guest-map-workspace-selector"
- assertNotVisible:
    id: "safe-route-picker"
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-resume-action"
- assertNotVisible:
    id: "safe-route-calendar-cleanup-alert"
- takeScreenshot: "connectivity-contract-calendar-principal-change-relaunch"
