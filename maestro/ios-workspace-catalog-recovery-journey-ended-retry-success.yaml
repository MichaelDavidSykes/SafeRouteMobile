      id: "workspace-access-refresh"
      enabled: false
    timeout: 3000
- assertVisible: "Checking current workspace access. Cached workspace remains available for review only."
- assertNotVisible:
    id: "safe-route-live-map"
- assertNotVisible:
    id: "safe-route-resume-action"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-stop-action"
- assertNotVisible:
    id: "safe-route-remaining-metrics"
- assertNotVisible:
    id: "safe-route-navigation-cleanup"
- takeScreenshot: "workspace-catalog-ended-journey-retry-busy"
- extendedWaitUntil:
