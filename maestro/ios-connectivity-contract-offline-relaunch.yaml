appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible:
      id: "saferoute-app-root"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "guest-map-network-status"
    timeout: 15000
- assertVisible: "Offline map. Saved route information remains available."
- assertVisible: "Workspace, Guidance Operations"
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-resume-action"
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- assertNotVisible: "Workspace, Choose workspace"
- assertVisible:
    id: "safe-route-offline-notice"
- assertVisible: "Offline saved routes. This copy was cached less than one hour ago and is review only. Reconnect and verify workspace access before starting guidance."
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- takeScreenshot: "connectivity-contract-offline-process-relaunch"
- tapOn:
    id: "route-list-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-network-status"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "guest-map-gate-calendar"
    direction: DOWN
    timeout: 20000
    speed: 40
- tapOn:
    id: "guest-map-gate-calendar"
- extendedWaitUntil:
    visible:
      id: "safe-route-operations"
    timeout: 20000
- assertVisible:
    id: "safe-route-operations-offline-notice"
- assertVisible: "Offline Operations. This calendar was saved less than one hour ago and is review only. Reconnect and verify workspace access before relying on this calendar. Saved calendar labels and endpoints are stored. Full route plans, live risk and ETA, and convoy manifests are not stored offline."
- assertVisible:
    id: "safe-route-operations-route-movement-1-1"
- assertVisible: "Cold restart verification v1"
- tapOn:
    id: "safe-route-operations-tab-convoy-management"
- assertVisible: "Convoys unavailable offline"
- assertNotVisible:
    id: "safe-route-operations-convoy-66e1b2c3d4e5f60718293e40"
- takeScreenshot: "connectivity-contract-offline-operations-calendar"
- tapOn:
    id: "safe-route-operations-tab-calendar"
- assertVisible:
    id: "safe-route-operations-route-movement-1-1"
