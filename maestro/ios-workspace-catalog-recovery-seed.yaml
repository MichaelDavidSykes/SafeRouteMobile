appId: host.exp.Exponent
---
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 15000
- tapOn:
    id: "safe-route-login-email"
- eraseText
- inputText: "driver@example.com"
- scrollUntilVisible:
    element:
      id: "safe-route-login-password"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "safe-route-login-password"
- eraseText
- inputText: "guidance-contract-password"
- tapOn:
    point: "50%, 18%"
- waitForAnimationToEnd:
    timeout: 1000
- scrollUntilVisible:
    element:
      id: "safe-route-login-primary-action"
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: "safe-route-login-primary-action"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn:
          text: "Not Now"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 1000
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn:
          text: "Not Now"
          retryTapIfNoChange: true
          waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "workspace-access-refresh"
    commands:
      - tapOn:
          id: "workspace-access-refresh"
          waitToSettleTimeoutMs: 100
      - extendedWaitUntil:
          notVisible:
            id: "workspace-access-refresh"
          timeout: 15000
- tapOn:
    id: "guest-map-workspace-selector"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-66a1b2c3d4e5f60718293a40"
    timeout: 10000
- tapOn:
    id: "guest-map-workspace-66a1b2c3d4e5f60718293a40"
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "safe-route-card-66b1b2c3d4e5f60718293b40"
    timeout: 30000
- assertVisible: "^Cold restart verification v1.*"
- tapOn:
    id: "route-list-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- assertNotVisible:
    id: "workspace-access-refresh"
- takeScreenshot: "workspace-catalog-seeded"
- stopApp
