appId: host.exp.Exponent
---
- runFlow: subflows/ios-open-expo-project.yaml
- extendedWaitUntil:
    visible:
      id: "guest-map-primary-action"
    timeout: 30000
- assertNotVisible:
    id: "guest-map-workspace-selector"
- extendedWaitUntil:
    visible:
      id: "safe-route-calendar-cleanup-alert"
    timeout: 15000
- assertVisible: "Offline Calendar unavailable. SafeRoute could not finish device storage protection. Retry before offline Calendar can be used."
- assertVisible:
    id: "safe-route-calendar-cleanup-retry"
    enabled: true
- assertNotVisible:
    id: "safe-route-suspended-navigation"
- assertNotVisible:
    id: "safe-route-resume-action"
- takeScreenshot: "connectivity-contract-calendar-auth-relaunch-failure"
