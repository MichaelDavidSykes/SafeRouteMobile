appId: host.exp.Exponent
---
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-login"
    timeout: 15000
- tapOn:
    id: "safe-route-login-email"
- eraseText
- inputText: "driver@example.com"
- tapOn:
    id: "safe-route-login-password"
- eraseText
- inputText: "guidance-contract-password"
- hideKeyboard
- tapOn:
    id: "safe-route-login-primary-action"
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "safe-route-workspace-selector"
    timeout: 30000
- tapOn:
    id: "safe-route-workspace-selector"
- tapOn:
    id: "safe-route-workspace-66a1b2c3d4e5f60718293a40"
- extendedWaitUntil:
    visible:
      id: "safe-route-card-66b1b2c3d4e5f60718293b40"
    timeout: 30000
- assertVisible: "^Cold restart verification v1.*"
- tapOn:
    id: "route-list-map-return"
- extendedWaitUntil:
    visible:
      id: "guest-map-workspace-selector"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- assertNotVisible:
    id: "workspace-access-refresh"
- takeScreenshot: "workspace-catalog-seeded"
- stopApp
