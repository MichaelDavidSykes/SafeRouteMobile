appId: host.exp.Exponent
---
- openLink: exp://localhost:8081
- extendedWaitUntil:
    visible: "Checking workspace…"
    timeout: 3000
- assertVisible:
    id: "guest-map-plot-action"
    enabled: false
- takeScreenshot: "workspace-catalog-foreground-checking-map"
- extendedWaitUntil:
    visible: "Workspace access changed. Unavailable workspace data was removed."
    timeout: 20000
- assertVisible: "Workspace, Support Operations"
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b41"
- assertNotVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- assertVisible:
    id: "workspace-access-refresh"
    enabled: true
- takeScreenshot: "workspace-catalog-foreground-loss-saved"
- stopApp
