appId: host.exp.Exponent
---
- tapOn:
    id: "safe-route-suspended-navigation-end"
- extendedWaitUntil:
    notVisible:
      id: "safe-route-suspended-navigation"
    timeout: 15000
- assertVisible: "Suspended route ended."
- tapOn:
    id: "guest-map-primary-action"
- extendedWaitUntil:
    visible:
      id: "safe-route-picker"
    timeout: 15000
- assertVisible: "Workspace, Guidance Operations"
- assertNotVisible: "Workspace, Choose workspace"
- assertVisible:
    id: "safe-route-offline-notice"
- assertVisible:
    id: "safe-route-card-66b1b2c3d4e5f60718293b40"
- assertVisible: "Offline · <1h old · reconnect to start"
- takeScreenshot: "connectivity-contract-offline-saved-review"
